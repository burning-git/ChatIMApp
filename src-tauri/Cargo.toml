[package]
name = "echo-desktop"
version = "0.1.9"
description = "Cross-platform local AI chat desktop app"
authors = ["you"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "echo_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
axum = "0.7"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
local-ip-address = "0.6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "system-proxy"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tokio = { version = "1", features = ["net", "sync", "rt", "macros"] }
uuid = { version = "1", features = ["v4", "serde"] }

[patch.crates-io]
# Remove after Wry releases nullable NSOpenPanel handling (upstream PR #1881).
wry = { path = "vendor/wry" }

