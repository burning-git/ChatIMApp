name: Build Windows installers

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows x64 (EXE + MSI)
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: x86_64-pc-windows-msvc
      - name: Install frontend and desktop build tools
        run: npm ci --registry=https://registry.npmjs.org
      - name: Test chat logic
        run: npm test
      - name: Check types and prepare frontend assets
        run: npm run build
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Test native backend
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc
      - name: Build Windows installers
        run: npm run package:win
      - name: Upload installable apps
        uses: actions/upload-artifact@v4
        with:
          name: Echo-x86_64-pc-windows-msvc
          path: installers/x86_64-pc-windows-msvc/
          if-no-files-found: error
          retention-days: 30
